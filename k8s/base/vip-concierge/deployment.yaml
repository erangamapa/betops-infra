apiVersion: apps/v1
kind: Deployment
metadata:
  name: vip-concierge
  labels:
    app.kubernetes.io/name: vip-concierge
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vip-concierge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vip-concierge
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: vip-concierge
      terminationGracePeriodSeconds: 45
      containers:
        - name: vip-concierge
          image: europe-west2-docker.pkg.dev/oddsmith-platform/platform/pulse-vip-concierge:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vip-concierge
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: openai-api-key
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: telegram-bot-token
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: telegram-webhook-secret
            - name: MANAGER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: manager-webhook-secret
            - name: LOYALTY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: loyalty-api-token
            - name: TRADING_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: trading-api-token
            - name: PLACEMENT_QUEUE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: placement-queue-token
            - name: VIP_BINDINGS
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: vip-bindings
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
