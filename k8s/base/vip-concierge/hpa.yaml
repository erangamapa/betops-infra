apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vip-concierge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vip-concierge
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # External metric stanza for queue depth matches the pulse-agents one.
