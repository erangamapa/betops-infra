apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
  labels:
    app.kubernetes.io/name: scoring
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scoring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoring
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: scoring
      terminationGracePeriodSeconds: 30
      containers:
        - name: scoring
          image: europe-west2-docker.pkg.dev/oddsmith-platform/platform/pulse-scoring:latest
          command: ["uvicorn", "scoring.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SCORING_MODEL_PATH
              value: /app/artifacts/win_model.joblib
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
