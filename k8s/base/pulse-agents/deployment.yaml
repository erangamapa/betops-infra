apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-agents
  labels:
    app.kubernetes.io/name: pulse-agents
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-agents
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-agents
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: pulse-agents
      terminationGracePeriodSeconds: 60
      containers:
        - name: pulse-agents
          image: europe-west2-docker.pkg.dev/oddsmith-platform/platform/pulse-agents:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pulse-agents
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
