name: deploy-example

# Manual only. This never runs on push or pull request.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after the plan is reviewed
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: prod-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: terraform init
        working-directory: terraform
      - run: terraform plan -out=tfplan -var="project_id=${{ vars.GCP_PROJECT_ID }}" -var="functions_source_bucket=${{ vars.FUNCTIONS_SOURCE_BUCKET }}"
        working-directory: terraform
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  apply:
    needs: plan
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    environment: prod-apply
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - run: terraform init
        working-directory: terraform
      - run: terraform apply tfplan
        working-directory: terraform
